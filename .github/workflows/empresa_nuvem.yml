# Empresa na nuvem GRÁTIS: um turno de trabalho por hora (o GitHub às vezes pula horários) (repositório público = minutos do GitHub Actions grátis).
# A memória fica num PostgreSQL gratuito (ex.: Neon). Guia: documentacao/nuvem_gratis.md
# Segredos (Settings → Secrets and variables → Actions): ROBO_PG_URL e ROBO_PG_SENHA_LEITURA. Nunca aparecem no log.
name: Empresa na nuvem (turnos)

on:
  schedule:
    - cron: "17 * * * *"     # toda hora, no minuto 17: o GitHub pula horários em momentos de carga; pedir toda hora compensa
  push:                      # ligar/forçar um turno sem o botão: mudar o arquivo nuvem/ligar
    paths: ["nuvem/ligar"]
  workflow_dispatch:
    inputs:
      minutos:
        description: "Duração do turno (minutos)"
        default: "40"

concurrency:
  group: empresa-nuvem      # nunca dois turnos ao mesmo tempo (o 2º espera o 1º salvar)
  cancel-in-progress: false

permissions:
  contents: write   # só para o boletim do celular: commits no ramo painel-celular (estado/estado.json)
  actions: write    # só para o turno chamar o próximo (empresa contínua)

jobs:
  turno:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requisitos.txt
      - name: Instalar dependências
        run: python -m pip install -r requisitos.txt
      - name: Turno de trabalho (restaura, trabalha, salva a cada 10 min)
        env:
          ROBO_PG_URL: ${{ secrets.ROBO_PG_URL }}
          ROBO_PG_SENHA_LEITURA: ${{ secrets.ROBO_PG_SENHA_LEITURA }}
          # grupo do Telegram (opcional): sem estes três segredos, o turno simplesmente não fala no grupo
          ROBO_TELEGRAM_TOKEN: ${{ secrets.ROBO_TELEGRAM_TOKEN }}
          ROBO_TELEGRAM_CHAT: ${{ secrets.ROBO_TELEGRAM_CHAT }}
          ROBO_TELEGRAM_DONO: ${{ secrets.ROBO_TELEGRAM_DONO }}
          # vincular o grupo só pelo celular: escreva "/vincular CÓDIGO" no grupo (CÓDIGO = este segredo, 8+ caracteres)
          ROBO_TELEGRAM_CODIGO: ${{ secrets.ROBO_TELEGRAM_CODIGO }}
          # app do celular: o turno publica o boletim da empresa a cada 5 min no ramo painel-celular
          ROBO_PUBLICAR_BOLETIM: "1"
        run: |
          MIN="${{ github.event.inputs.minutos }}"
          [ -z "$MIN" ] && [ "${{ github.event_name }}" = "push" ] && MIN="$(grep -Eo '^[0-9]+' nuvem/ligar | head -1)"
          python -m robo turno --minutos "${MIN:-40}" --pasta "$RUNNER_TEMP/empresa"
      # Empresa contínua: o GitHub costuma atrasar o horário marcado em horas. Ao terminar BEM, o turno chama o
      # próximo (o "concurrency" acima garante um por vez). Para pausar pelo celular: Settings → Secrets and
      # variables → Actions → aba Variables → criar ROBO_TURNO_CONTINUO com o valor 0.
      - name: Chamar o próximo turno
        # format() deixa a comparação entre textos: com a variável inexistente, null != '0' virava 0 != 0 (número) e a
        # etapa era PULADA em todo turno (achado no log: a empresa parava ~5 h entre turnos)
        if: success() && format('{0}', vars.ROBO_TURNO_CONTINUO) != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run empresa_nuvem.yml --ref "${{ github.ref_name }}"
