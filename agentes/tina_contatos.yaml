# Agente de exemplo, ATIVO. Habilidades marcadas como opcionais: se a planilha não tiver a coluna, ela pula sem reprovar.
# Padroniza contatos e classifica o NPS das bases de pesquisa (arquivos que começam com nps_).
id: tina_contatos
nome: Tina
papel: Contatos e NPS
descricao: Padroniza telefones e e-mails para o closed loop com detratores e cria a coluna grupo_nps.
cor: '#F97316'
posicao: limpeza
ordem: 10
ativo: true
nivel: pleno
area: Qualidade de Dados
cargo: Analista Pleno de Dados de Contato
aplicar_em:
- nps_*
habilidades:
- habilidade: validar_email
  ativo: true
  opcional: true
  parametros:
    colunas: [email]
    invalidos: vazio
- habilidade: normalizar_telefone
  ativo: true
  opcional: true
  parametros:
    colunas: [telefone]
    formato: formatado
    invalidos: aviso
- habilidade: classificar_nps
  ativo: true
  opcional: true
  parametros:
    coluna: nota_nps
